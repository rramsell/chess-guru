[project]
name = "chess-guru"
version = "0.1.4"
description = "Async Chess.com public API client"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]

authors = [
  { name = "Richard Ramsell", email = "richramsell@proton.me" },
]

keywords = ["chess", "chess.com", "api", "pgn", "async", "aiohttp"]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Typing :: Typed",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Games/Entertainment :: Board Games",
  "Topic :: Software Development :: Libraries",
]

dependencies = [
  "aiohttp>=3.13.5",
  "backoff>=2.2.1",
]

[project.urls]
Homepage = "https://github.com/rramsell/chess-guru"
Repository = "https://github.com/rramsell/chess-guru"
Issues = "https://github.com/rramsell/chess-guru/issues"

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[dependency-groups]
dev = [
  "pytest>=8.4.2",
  "pytest-asyncio>=1.2.0",
  "pytest-rerunfailures>=16.0.1",
]

[tool.ruff]
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.ruff.lint.isort]
known-first-party = ["chess_guru"]
