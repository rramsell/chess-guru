name: tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      username:
        description: "Chess.com username for integration tests (blank = test default)"
        required: false
        default: ""

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
      - run: uvx ruff check src tests
      - run: uvx ruff format --check src tests

  unit:
    name: unit (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install deps
        run: uv sync --group dev

      - name: Check import
        run: uv run python -c "import chess_guru; print(chess_guru.__name__)"

      - name: Run unit tests
        run: uv run pytest tests

  integration:
    # Hits the live chess.com API, so only run when triggered by hand.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.12"

      - name: Install deps
        run: uv sync --group dev

      - name: Run integration tests
        env:
          CHESSCOM_TEST_USERNAME: ${{ inputs.username }}
        run: uv run pytest tests -m integration --reruns 2 --reruns-delay 5
