name: tests

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"  # weekly live API check
  workflow_dispatch:
    inputs:
      provider:
        description: "Which live API to test"
        type: choice
        options: [all, chesscom, lichess]
        default: all
      chesscom_username:
        description: "Chess.com username for integration tests (blank = test default)"
        required: false
        default: ""
      lichess_username:
        description: "Lichess username for integration tests (blank = test default)"
        required: false
        default: ""

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
      - run: uvx ruff check src tests
      - run: uvx ruff format --check src tests

  unit:
    name: unit (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install deps
        run: uv sync --group dev

      - name: Check import
        run: uv run python -c "import chess_guru; print(chess_guru.__name__)"

      - name: Run unit tests
        run: uv run pytest tests

  unit-lowest:
    # Checks the lower bounds in pyproject, pydantic in particular.
    name: unit (lowest deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.9"

      - name: Install deps
        run: uv sync --group dev --resolution lowest-direct

      - name: Run unit tests
        run: uv run pytest tests

  integration:
    # Hits live APIs, so only run by hand or on the weekly schedule.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # inputs are empty on scheduled runs, so fall back to every provider
        provider: ${{ fromJSON((inputs.provider == 'chesscom' || inputs.provider == 'lichess') && format('["{0}"]', inputs.provider) || '["chesscom", "lichess"]') }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.12"

      - name: Install deps
        run: uv sync --group dev

      - name: Run integration tests
        env:
          CHESSCOM_TEST_USERNAME: ${{ inputs.chesscom_username }}
          LICHESS_TEST_USERNAME: ${{ inputs.lichess_username }}
          LICHESS_TOKEN: ${{ secrets.LICHESS_TOKEN }}
        run: uv run pytest tests -m "integration and ${{ matrix.provider }}" --reruns 2 --reruns-delay 5
